appId: com.leonardo.mesarpg
productName: MesaRPG
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: MesaRPG-Setup-${version}.${ext}
publish:
  provider: github
  owner: LeonardoAValerio
  repo: mesa-rpg
  releaseType: release
